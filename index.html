// ========== SOUND SYSTEM ==========
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playCorrectSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(523, audioCtx.currentTime); // C5
    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1); // E5
    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2); // G5
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
}

function playWrongSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.setValueAtTime(280, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.35);
}

function startGame(category) {
    currentCategory = category;
    currentQuestionIndex = 0;
    answered = false;
    
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('starCount').textContent = stars;
    
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    const qs = questionSets[currentCategory];
    if (currentQuestionIndex >= qs.length) {
        // All questions done
        document.getElementById('optionsContainer').innerHTML = `
            <div style="text-align:center; padding:20px;">
                <h2>🎉 Tapos na! | Completed!</h2>
                <p class="tagalog">Mahusay na pagtatrabaho!</p>
                <p class="english">Great work!</p>
                <p class="stars">⭐ ${stars}</p>
                <button class="menu-btn" onclick="goBack()">Bumalik sa Tahanan | Return Home</button>
            </div>
        `;
        document.getElementById('feedbackBox').style.display = 'none';
        return;
    }
    
    const q = qs[currentQuestionIndex];
    document.getElementById('questionTL').textContent = q.tl;
    document.getElementById('questionEN').textContent = q.en;
    document.getElementById('feedbackBox').style.display = 'none';
    
    let html = '';
    q.options.forEach((opt, idx) => {
        html += `
            <button class="option-btn" id="opt-${idx}" onclick="checkAnswer(${idx}, ${opt.correct ? true : false})">
                <span class="tagalog">${String.fromCharCode(65+idx)}. ${opt.tl}</span><br>
                <span class="english">${opt.en}</span>
            </button>
        `;
    });
    document.getElementById('optionsContainer').innerHTML = html;
}

function checkAnswer(index, isCorrect) {
    if (answered) return;
    answered = true;
    
    const q = questionSets[currentCategory][currentQuestionIndex];
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackTL = document.getElementById('feedbackTL');
    const feedbackEN = document.getElementById('feedbackEN');
    
    // Highlight buttons
    document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');
    
    if (isCorrect) {
        playCorrectSound();
        document.getElementById(`opt-${index}`).classList.add('correct');
        feedbackTL.textContent = q.feedbackCorrectTL;
        feedbackEN.textContent = q.feedbackCorrectEN;
        feedbackBox.className = 'feedback correct';
        stars++;
        localStorage.setItem('dgStars', stars);
        document.getElementById('starCount').textContent = stars;
    } else {
        playWrongSound();
        document.getElementById(`opt-${index}`).classList.add('wrong');
        feedbackTL.textContent = q.feedbackWrongTL;
        feedbackEN.textContent = q.feedbackWrongEN;
        feedbackBox.className = 'feedback wrong';
        // Show correct answer
        q.options.forEach((opt, i) => {
            if (opt.correct) document.getElementById(`opt-${i}`).classList.add('correct');
        });
    }
    
    feedbackBox.style.display = 'block';
}

function loadNextQuestion() {
    currentQuestionIndex++;
    loadQuestion();
}

function goBack() {
    document.getElementById('mainMenu').style.display = 'block';
    document.getElementById('gameArea').style.display = 'none';
    currentCategory = null;
}

// Initialize
updateConnectionStatus();
window.addEventListener('online', updateConnectionStatus);
window.addEventListener('offline', updateConnectionStatus);
</script>
</body>
</html>
